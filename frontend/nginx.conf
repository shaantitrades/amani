# Nginx pour la PWA Bodogui (conteneur Coolify)
# - sert les fichiers statiques du build Vite
# - relaie /api et /media vers le conteneur "api" (reseau Docker interne)
# - compression et cache agressif : essentiels sur connexion lente

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Le backend est joignable par son nom de service Coolify
  set $api_upstream "http://api:4000";

  client_max_body_size 6m;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Sonde de sante (Coolify / monitoring)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # API : jamais mise en cache par Nginx (le SW gere le cache applicatif)
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Medias et messages vocaux systeme : cache long (Cloudflare prend le relais)
  location /media/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Messages vocaux du systeme (/voice/<langue>/<cle>.opus)
  location /voice/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    expires 30d;
  }

  # Fichiers du build : noms hashes par Vite -> cache immuable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker et manifest : toujours revalides
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Application monopage : toute route inconnue renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
