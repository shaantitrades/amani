# =============================================================================
# Bodogui - pile de production pour Coolify (VPS Contabo)
#
# Services :
#   db      PostgreSQL 16 auto-heberge (reseau Docker interne, non expose)
#   redis   Redis 7 (cache OTP, listes de blocage, rate limiting)
#   api     API Node.js (Express)
#   web     PWA React servie par Nginx (proxy /api et /media vers api)
#
# Deploiement Coolify :
#   1. New Resource > Docker Compose > ce depot, fichier docker-compose.yml
#   2. Renseigner les variables d'environnement (voir docs/ENVIRONMENT.md)
#   3. Domaine : bodogui.com -> service web (port 80)
#               api.bodogui.com -> service api (port 4000)
#   Coolify gere le SSL Let's Encrypt et les redemarrages automatiques.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodogui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-bodogui}
      # Optimisations pour un VPS 4 vCPU / 8 Go (MVP, faible volumetrie)
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bodogui} -d ${POSTGRES_DB:-bodogui}']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Connexion PostgreSQL : les variables PG* sont transmises telles quelles
      # et l'API construit elle-meme l'URL en encodant le mot de passe
      # (src/config/env.js > buildDatabaseUrl). Ne PAS fabriquer DATABASE_URL
      # ici : un mot de passe base64 (+, /, =) couperait l'URL avant l'hote
      # (`getaddrinfo ENOTFOUND ...`) et l'API ne demarrerait pas.
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-bodogui}
      PGPASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL obligatoire}
      PGDATABASE: ${POSTGRES_DB:-bodogui}
      # 1 = comportement strict : sortir en erreur si la base est injoignable.
      # Par defaut (0) l'API demarre quand meme et publie la cause sur
      # /api/v1/healthz au lieu de laisser un 502 opaque cote Nginx.
      STRICT_STARTUP: ${STRICT_STARTUP:-0}
      MIGRATE_ATTEMPTS: ${MIGRATE_ATTEMPTS:-12}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire (openssl rand -hex 32)}
      JWT_TTL: ${JWT_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      OTP_DEV_ECHO: 'false'
      OTP_PER_PHONE_PER_HOUR: ${OTP_PER_PHONE_PER_HOUR:-5}
      # Connexion de recette : code fixe sans SMS (vide = desactive)
      TEST_LOGIN_PHONES: ${TEST_LOGIN_PHONES:-}
      TEST_LOGIN_CODE: ${TEST_LOGIN_CODE:-}
      # Canal principal et canal de secours (essaye une seule fois si le
      # principal echoue). IMPORTANT : toute variable ajoutee ici doit l'etre
      # aussi dans docker-compose.yml, sinon Coolify l'ignore silencieusement.
      SMS_PROVIDER: ${SMS_PROVIDER:-africastalking}
      SMS_FALLBACK_PROVIDER: ${SMS_FALLBACK_PROVIDER:-none}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-BODOGUI}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # WhatsApp (Meta Cloud API) : canal le moins cher au Tchad. WHATSAPP_PHONE_ID
      # = « Phone number ID » (console Meta > API Setup), WHATSAPP_TOKEN = jeton
      # d'utilisateur systeme. WHATSAPP_TEMPLATE = modele valide, obligatoire hors
      # fenetre de 24 h : le CODE part dans le premier parametre ({{1}}).
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-fr}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      # Passerelle HTTP generique : brancher n'importe quel agregateur SMS sans
      # redeployer ({{to}}, {{to_digits}}, {{body}}, {{from}}, {{app}} dans
      # SMS_HTTP_BODY). Voir docs/ENVIRONMENT.md.
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-POST}
      SMS_HTTP_HEADERS: ${SMS_HTTP_HEADERS:-}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      # Stockage : Backblaze B2 en production (MinIO en developpement)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-b2}
      S3_BUCKET: ${S3_BUCKET:-bodogui-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-bodogui-media}
      B2_REGION: ${B2_REGION:-eu-central-003}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      WHISPER_URL: ${WHISPER_URL:-}
      GOOGLE_STT_API_KEY: ${GOOGLE_STT_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@bodogui.com}
      FRAUD_AUTO_HIDE_REPORTS: ${FRAUD_AUTO_HIDE_REPORTS:-3}
    volumes:
      - api-storage:/app/var/storage
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Portail d'installation : 'invite' (defaut) le propose sans l'imposer,
      # 'mandatory' le rend bloquant, 'off' le desactive completement. La valeur
      # est figee dans le bundle au build : changer ici demande un redeploiement
      # avec reconstruction de l'image.
      args:
        VITE_INSTALL_GATE: ${VITE_INSTALL_GATE:-invite}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    # Port 80 INTERNE uniquement : sur Coolify c'est Traefik (installe avec Coolify) qui
    # occupe 80/443 sur l'hote et route vers ce conteneur. Publier '80:80' ici ferait
    # echouer le demarrage ("port is already allocated").
    # Pile de production SANS Coolify :
    #   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
    expose:
      - '80'
    networks:
      - internal

volumes:
  db-data:
  redis-data:
  api-storage:

networks:
  internal:
    driver: bridge
